; ==================================================================
; Multi-Robot PlatformIO Project Template
; ==================================================================
; Structure:
;   - lib/            shared modules used by ANY robot (auto-detected)
;   - src/<robot>/     each robot's own main.cpp + robot-specific code
;   - [env] section    settings/libs common to ALL robots
;   - [env:robotN]     per-robot board, port, and extra libs
;
; Build / upload a single robot:
;   platformio run -e robot1 --target upload
;
; Open serial monitor for a robot:
;   platformio device monitor -e robot1
;
; List connected devices/ports:
;   platformio device list
; ==================================================================

[platformio]
default_envs = robot1

; ---------------- Shared across every robot ----------------
[env]
framework = arduino
monitor_speed = 115200

; Third-party libs installed via the Arduino IDE (Smorphi, etc.) live
; here and are visible to every robot. NOTE: this is one shared copy
; on disk — there's no per-robot version pinning like lib_deps gives
; you. If you update a lib here, every robot using it updates too.
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries 

; Registry libraries every single robot needs go here (these DO
; support per-robot version pins, done per env below). Robot-specific
; envs extend this list with ${env.lib_deps}.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; ==================================================================
; ROBOT 1
; ==================================================================
[env:robot1]
platform    = espressif32
board       = esp32dev              ; <- set to this robot's actual chip
upload_port = COM5                  ; <- set to this robot's actual port
build_src_filter = -<*> +<robot1/>
lib_deps =
    ${env.lib_deps}

; ==================================================================
; ROBOT 2
; ==================================================================
[env:robot2]
platform    = espressif32
board       = esp32-s3-devkitc-1
upload_port = COM6
build_src_filter = -<*> +<robot2/>
lib_deps =
    ${env.lib_deps}

; ==================================================================
; ROBOT 3
; ==================================================================
[env:robot3]
platform    = espressif32
board       = esp32dev
upload_port = COM7
build_src_filter = -<*> +<robot3/>
lib_deps =
    ${env.lib_deps}

; ==================================================================
; ROBOT 4
; ==================================================================
[env:robot4]
platform    = espressif32
board       = esp32dev
upload_port = COM8
build_src_filter = -<*> +<robot4/>
lib_deps =
    ${env.lib_deps}

